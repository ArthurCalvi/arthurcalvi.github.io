{% if include.src or page.audio %}
<div class="article-audio">
  {% if include.caption or page.audio_caption %}
  <p>{{ include.caption | default: page.audio_caption }}</p>
  {% endif %}
  <audio controls
    {% if include.autoplay or page.audio_autoplay %}autoplay{% endif %}
    {% if include.loop or page.audio_loop %}loop{% endif %}
    src="{{ include.src | default: page.audio | relative_url }}">
    Your browser does not support the audio element.
  </audio>
</div>
{% endif %}
