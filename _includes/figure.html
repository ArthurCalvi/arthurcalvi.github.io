{% assign klass = include.variant | default: include.class %}
<figure class="article-figure">
  <img src="{{ include.src | relative_url }}" alt="{{ include.alt | escape }}"{% if klass %} class="{{ klass }}"{% endif %} />
  {% if include.caption %}
  <figcaption>{{ include.caption }}</figcaption>
  {% endif %}
</figure>
