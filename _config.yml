title: Arthur Calvi
description: Arthur Calvi leads the AI Acceleration Team at DxO Labs, exploring products and operating systems through which people and AI can act together.
url: https://arthurcalvi.github.io
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM

collections:
  articles:
    output: true
    permalink: /articles/:name/
  reflections:
    output: true
    permalink: /feed/:name/

defaults:
  - scope:
      path: ""
      type: articles
    values:
      layout: article
  - scope:
      path: ""
      type: reflections
    values:
      layout: article
      section: feed

exclude:
  - .bundle
  - .github
  - .gitignore
  - .serena
  - .DS_Store
  - AGENTS.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - package.json
  - package-lock.json
  - next.config.js
  - next-env.d.ts
  - tsconfig.json
  - vercel.json
  - app
  - components
  - content
  - hooks
  - lib
  - styles
  - public
  - _site
  - out
  - vendor
