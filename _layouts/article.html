---
layout: default
---
<article class="article-shell">
  <header class="article-header">
    <h1>{{ page.title }}</h1>
    {% if page.date %}<time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>{% endif %}
    {% include audio.html %}
  </header>
  <div class="article-content">
    {{ content }}
  </div>
</article>
