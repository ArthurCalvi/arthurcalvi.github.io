---
layout: default
---
<article class="article-shell"{% if page.reading_focus %} data-reading-focus-page{% endif %}>
  <header class="article-header">
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="article-deck">{{ page.description }}</p>{% endif %}
    {% include audio.html %}
    <div class="article-reading-row">
      {% if page.date %}<time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>{% endif %}
      <a class="article-scroll-cue" href="#article-start">
        <span>Continue reading</span>
        <span aria-hidden="true">↓</span>
      </a>
    </div>
  </header>
  <div class="article-content" id="article-start">
    {{ content }}
  </div>
</article>
