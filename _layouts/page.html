---
layout: default
---
<section class="page-header">
  <p class="eyebrow">{{ page.eyebrow | default: page.section }}</p>
  <h1>{{ page.title }}</h1>
  {% if page.description %}
  <p class="lede">{{ page.description }}</p>
  {% endif %}
</section>

<section class="content-wrap">
  {{ content }}
</section>
