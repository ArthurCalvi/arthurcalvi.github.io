<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  {% capture page_title %}{% if page.url == '/' %}Arthur Calvi{% elsif page.title %}{{ page.title }} | Arthur Calvi{% else %}Arthur Calvi{% endif %}{% endcapture %}
  <title>{{ page_title | strip }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <meta name="theme-color" content="#f7f5ef" />
  <link rel="canonical" href="{{ page.url | absolute_url }}" />
  <meta property="og:title" content="{{ page_title | strip }}" />
  <meta property="og:description" content="{{ page.description | default: site.description }}" />
  <meta property="og:type" content="{% if page.layout == 'article' %}article{% else %}website{% endif %}" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml" />
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
  {% if page.math %}
  <script>
    MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true },
      svg: { fontCache: 'global' }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" defer></script>
  {% endif %}
</head>
<body class="section-{{ page.section | default: 'home' }}">
  {% include nav.html %}
  <main>
    {{ content }}
  </main>
  <footer class="site-footer">
    <span>Arthur Calvi</span>
    <div class="footer-links">
      <a href="mailto:arthur.calvi@icloud.com">Email</a>
      <a href="https://github.com/ArthurCalvi" target="_blank" rel="noopener">GitHub</a>
      <a href="https://www.linkedin.com/in/arthur-calvi" target="_blank" rel="noopener">LinkedIn</a>
    </div>
  </footer>
</body>
</html>
